services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mgp}
      POSTGRES_USER: ${POSTGRES_USER:-mgp_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ${MGP_IMAGE:-mgp:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MGP_ADDR: :8080
      MGP_SESSION_KEY: ${MGP_SESSION_KEY:?set MGP_SESSION_KEY in .env}
      MGP_DATABASE_URL: postgres://${POSTGRES_USER:-mgp_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mgp}?sslmode=disable
      MGP_DOCUMENT_DIR: /var/lib/mgp/documents
      MGP_SECURE_COOKIE: ${MGP_SECURE_COOKIE:-false}
    volumes:
      - documents_data:/var/lib/mgp/documents
    ports:
      - "${MGP_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  documents_data:
